# Auto-publish to npm on version tag push
# Usage: npm version patch/minor/major → git push --tags
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  test:
    name: Typecheck, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
      - run: npm ci --prefix packages/core

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  publish-npm:
    name: Publish Packages to npm
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm ci --prefix packages/core

      - name: Determine npm dist-tag
        id: npm-tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          if [[ "$VERSION" == *-* ]]; then
            echo "dist_tag=${VERSION#*-}" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: npm run build

      - name: Publish core with provenance
        run: npm publish --access public --provenance --tag "${{ steps.npm-tag.outputs.dist_tag }}"
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Wait for core package to be visible
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          for attempt in {1..20}; do
            if npm view "@ruah-dev/conv-core@$VERSION" version >/dev/null 2>&1; then
              exit 0
            fi
            sleep 15
          done
          echo "Timed out waiting for @ruah-dev/conv-core@$VERSION to be available on npm."
          exit 1

      - name: Rewrite root manifest for registry publish
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          VERSION="$VERSION" node <<'EOF'
          const fs = require("node:fs");
          const version = process.env.VERSION;
          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          packageJson.dependencies["@ruah-dev/conv-core"] = version;
          fs.writeFileSync("package.json", JSON.stringify(packageJson, null, "\t") + "\n");
          EOF

      - name: Publish root package with provenance
        run: npm publish --access public --provenance --tag "${{ steps.npm-tag.outputs.dist_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: GitHub Release
    needs: publish-npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version info
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          PRERELEASE_FLAG=""

          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$TAG" \
            --title "ruah conv $TAG" \
            --generate-notes \
            --notes-start-tag "$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo '')" \
            $PRERELEASE_FLAG \
            --verify-tag
