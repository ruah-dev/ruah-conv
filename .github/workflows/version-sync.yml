# Version sync — fail if .claude/governance.md drifts from root package.json
name: Version Sync

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    name: governance.md vs package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare versions
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          # Match a line like: "- Version: 0.4.0 (published on npm)" or "Version: v0.4.0"
          GOV_VERSION=$(grep -Eom1 'Version:[[:space:]]*v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?' .claude/governance.md \
            | sed -E 's/^Version:[[:space:]]*v?//')
          echo "package.json   : $PKG_VERSION"
          echo "governance.md  : $GOV_VERSION"
          if [ -z "$GOV_VERSION" ]; then
            echo "::error file=.claude/governance.md::Could not find a 'Version: X.Y.Z' line in governance.md"
            exit 1
          fi
          if [ "$PKG_VERSION" != "$GOV_VERSION" ]; then
            echo "::error::Version mismatch — package.json=$PKG_VERSION but governance.md=$GOV_VERSION. Run 'npm run prepare-release -- --version v$PKG_VERSION' or update .claude/governance.md."
            exit 1
          fi
